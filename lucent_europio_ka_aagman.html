// Shuffle array utility
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function renderQuiz() {
  const container = document.getElementById('quiz-container');
  
  quizData.forEach((item, qIndex) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'question-block';
    
    // Question Text
    const qText = document.createElement('div');
    qText.className = 'question-text';
    qText.innerText = item.q;
    qDiv.appendChild(qText);
    
    // Shuffle Options randomly on page load
    const shuffledOpts = shuffleArray([...item.opts]);
    
    const ul = document.createElement('ul');
    ul.className = 'options-list';
    
    // Explanation container (hidden initially)
    const expDiv = document.createElement('div');
    expDiv.className = 'explanation';
    expDiv.innerHTML = "<strong>विस्तृत व्याख्या (Explanation):</strong> " + item.exp;

    shuffledOpts.forEach((opt, oIndex) => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.t;
      
      btn.onclick = () => {
        // Disable all buttons once an answer is selected
        const allBtns = ul.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);
        
        // Highlight logic
        if (opt.c) {
          btn.classList.add('correct');
        } else {
          btn.classList.add('wrong');
          // Find the correct answer and highlight it in green
          allBtns.forEach(b => {
             const originalOpt = shuffledOpts.find(o => o.t === b.innerText);
             if (originalOpt && originalOpt.c) b.classList.add('correct');
          });
        }
        
        // Reveal detailed explanation below the options
        expDiv.style.display = 'block';
      };
      
      li.appendChild(btn);
      ul.appendChild(li);
    });
    
    qDiv.appendChild(ul);
    qDiv.appendChild(expDiv);
    container.appendChild(qDiv);
  });
}

// Render quiz when window loads
window.onload = renderQuiz;
</script>
